    <rect x="22" y="9" width="16" height="21" rx="2.5" fill="#22c55e"/>
    <rect x="24.2" y="11.2" width="11.6" height="16.6" rx="1.5" fill="none" stroke="#dcfce7" stroke-width="1.1"/>
    <circle cx="30" cy="17.5" r="2.8" fill="#dcfce7"/>
