# Bots de precios: recorren los súper una vez al día y actualizan la base en Turso.
# Necesita los secretos TURSO_DATABASE_URL y TURSO_AUTH_TOKEN en
# Settings -> Secrets and variables -> Actions del repositorio.
name: Actualizar precios

on:
  schedule:
    # 5:17 a. m. de Panamá (UTC-5). Una corrida tarda unos 30 min: en un repositorio privado,
    # los 2 000 min gratis al mes alcanzan para una al día. Con el repo público: '17 5,17 * * *'.
    - cron: '17 10 * * *'
  workflow_dispatch:         # botón «Run workflow» para correrlo a mano

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
