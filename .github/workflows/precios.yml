# Bots de precios: recorren los súper cada 6 horas y actualizan la base en Turso.
# Necesita los secretos TURSO_DATABASE_URL y TURSO_AUTH_TOKEN en
# Settings -> Secrets and variables -> Actions del repositorio.
name: Actualizar precios

on:
  schedule:
    - cron: '17 */6 * * *'  # cada 6 horas (hora UTC); minuto 17 para evitar la hora pico de GitHub
  workflow_dispatch:         # botón «Run workflow» para correrlo a mano

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
