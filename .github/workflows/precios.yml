# Bots de precios: recorren los súper dos veces al día y actualizan la base en Turso.
# (Súper 99 tiene su propio trabajo: .github/workflows/super99.yml.)
# Necesita los secretos TURSO_DATABASE_URL y TURSO_AUTH_TOKEN en
# Settings -> Secrets and variables -> Actions del repositorio.
name: Actualizar precios

on:
  schedule:
    # 5:17 a. m. y 5:17 p. m. de Panamá (UTC-5). Una corrida tarda unos 35 min; con el
    # repositorio público los minutos no tienen límite. Si vuelve a ser privado (2 000 min
    # gratis al mes), dejar una sola: '17 10 * * *'.
    - cron: '17 10,22 * * *'
  workflow_dispatch:         # botón «Run workflow» para correrlo a mano

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Avisa a los celulares lo que bajó de precio en esta corrida.
      - run: npm run notify -- lista
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
