# Avisos de la mañana a los celulares: el día de descuento de hoy y la rebaja más grande.
# Lo que baja de precio se avisa aparte, al final de cada corrida de los bots
# (precios.yml y super99.yml). Los envía scripts/notify.js por el servicio de Expo.
# Necesita los mismos secretos TURSO_DATABASE_URL y TURSO_AUTH_TOKEN.
name: Avisos de la mañana

on:
  schedule:
    # 8:00 a. m. de Panamá (UTC-5): temprano, pero no de madrugada.
    - cron: '0 13 * * *'
  workflow_dispatch:         # botón «Run workflow» para mandarlos a mano
    inputs:
      tipo:
        description: Qué avisar
        type: choice
        default: los de la mañana
        options:
          - los de la mañana
          - prueba
          - lista
          - promos
          - ofertas

concurrency:
  group: avisos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Por la mañana van los dos; a mano se puede elegir uno solo (o el de prueba).
      # El día de descuento solo se avisa si hay alguno activo hoy en data/promos.json;
      # las ofertas del día solo le llegan a quien encendió ese interruptor.
      - if: inputs.tipo == '' || inputs.tipo == 'los de la mañana'
        run: npm run notify -- promos && npm run notify -- ofertas
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - if: inputs.tipo != '' && inputs.tipo != 'los de la mañana'
        run: npm run notify -- ${{ inputs.tipo }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
