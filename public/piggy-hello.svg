<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="El cerdito de Mercapty saluda con una moneda de oro en la mano">
  <!--
    El cerdito del logo, de pie, saludando con una mano y con una moneda de oro en la otra.
    Mismas formas y colores que public/icon.svg y public/loader.svg. Los brazos son líneas
    gruesas con la punta redonda, que es lo que les da forma de bracito. El saludo gira la
    mano desde el hombro; se rehace igual en la app (mobile/src/components/piggy-hello.tsx).
  -->
  <style>
    .wave { transform-box: view-box; transform-origin: 65px 52px; animation: wave 2s ease-in-out infinite; }
    @keyframes wave { 0%, 55%, 100% { transform: rotate(0deg); } 18% { transform: rotate(16deg); } 36% { transform: rotate(-12deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse cx="48" cy="89" rx="22" ry="3.2" fill="#0f172a" opacity=".1"/>

  <!-- patas, una más oscura para que se note cuál está detrás -->
  <rect x="34" y="70" width="11" height="17" rx="5.5" fill="#f48fb8"/>
  <rect x="51" y="70" width="11" height="17" rx="5.5" fill="#f9a8c9"/>

  <!-- cuerpo -->
  <ellipse cx="48" cy="58" rx="23" ry="19" fill="#ffd1e1"/>
  <ellipse cx="37" cy="51" rx="5.5" ry="3" fill="#fff" opacity=".5" transform="rotate(-25 37 51)"/>

  <!-- orejas caídas, como las del logo -->
  <path d="M30 20c-2.5-3.5-3-8-1-9.5s5.5.5 7.5 4.5z" fill="#f9a8c9"/>
  <path d="M66 20c2.5-3.5 3-8 1-9.5s-5.5.5-7.5 4.5z" fill="#f9a8c9"/>

  <!-- cabeza -->
  <circle cx="48" cy="33" r="20" fill="#ffd1e1"/>
  <!-- ranura de alcancía, en la coronilla -->
  <rect x="41" y="14.2" width="14" height="3" rx="1.5" fill="#be185d"/>
  <circle cx="30" cy="40" r="3.4" fill="#f9a8c9" opacity=".75"/>
  <circle cx="66" cy="40" r="3.4" fill="#f9a8c9" opacity=".75"/>
  <rect x="40" y="35" width="16" height="12.5" rx="6.25" fill="#f9a8c9"/>
  <circle cx="44.6" cy="41.2" r="1.6" fill="#be185d"/>
  <circle cx="51.4" cy="41.2" r="1.6" fill="#be185d"/>
  <circle cx="39.5" cy="28" r="2.8" fill="#1e293b"/>
  <circle cx="40.5" cy="27" r="0.95" fill="#fff"/>
  <circle cx="56.5" cy="28" r="2.8" fill="#1e293b"/>
  <circle cx="57.5" cy="27" r="0.95" fill="#fff"/>

  <!-- brazo que saluda, por delante de la cabeza -->
  <g class="wave">
    <path d="M65 52L75 36" stroke="#f9a8c9" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="33" r="6.5" fill="#f9a8c9"/>
  </g>

  <!-- brazo con la moneda -->
  <path d="M31 57L20 67" stroke="#f9a8c9" stroke-width="9" stroke-linecap="round" fill="none"/>
  <g>
    <circle cx="19" cy="69" r="9" fill="#f59e0b"/>
    <circle cx="19" cy="69" r="7" fill="#fbbf24"/>
    <path d="M20.6 66c-.6-.9-3.5-1-3.5.7 0 1.9 3.7 1 3.7 2.9 0 1.6-2.8 1.6-3.7.5M18.9 64.4v9.4" fill="none" stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
